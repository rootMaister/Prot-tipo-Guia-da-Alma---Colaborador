<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` lets the page draw under the system bars, so gradients and full
      -bleed surfaces continue behind the status bar instead of stopping at its edge. It
      also makes `dvh` include the safe areas, so every element that touches an edge has to
      add the device inset back — see the `*-safe` utilities in styles/index.css.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Tints the browser's own bars on iOS — the status bar and the address bar. This is the
      value before React mounts; `useScreenSurface` replaces it per screen. Kept in sync
      with the `html` background in styles/index.css.
    -->
    <meta name="theme-color" content="#f5f4f1" />
    <title>Protótipo — Colaborador UI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
